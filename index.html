<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kollins Temp Mail</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>📩 Kollins Temp Mail</h1>
        <p>Free temporary email service</p>
    </header>


    <main class="container">

        <section class="card">

            <h2>Your Temporary Email</h2>

            <p class="description">
                Create a disposable email address instantly.
            </p>


            <div class="email-box">
                <span id="email">
                    No email created yet
                </span>
            </div>


            <button id="createEmail">
                Create Email
            </button>


            <p class="timer">
                Expires in:
                <span id="timer">10:00</span>
            </p>


            <a href="inbox.html" class="btn">
                Open Inbox
            </a>

        </section>

    </main>


    <footer>
        <p>
            © 2026 Kollins Temp Mail
        </p>
    </footer>


    <script src="js/app.js"></script>

</body>
</html>
